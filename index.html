<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karcana</title>

    <link
        rel="preload"
        href="assets/fonts/Britney-Bold.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >

    <link
        rel="preload"
        href="assets/fonts/Britney-Regular.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Still image shown while video is not playing -->

    <img
        class="background-still"
        src="assets/moon-still.jpg"
        alt=""
        aria-hidden="true"
    >

    <!-- Background video -->

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
    >
        <source src="assets/full-moon-at-dusk.mp4" type="video/mp4">
    </video>

    <!-- Logo and Explore button -->

    <main class="content">
        <div class="logo-container">

            <h1>Karcana</h1>

            <button class="explore-button">
                Explore
            </button>

        </div>
    </main>

    <script>
        const video = document.querySelector(".background-video");
        const exploreButton = document.querySelector(".explore-button");

        video.muted = true;
        video.disablePictureInPicture = true;

        function startVideo() {
            video.play().catch(() => {
                console.log("Video playback requires user interaction.");
            });
        }

        // Start automatically where the browser allows it.
        startVideo();

        // Once the video is genuinely playing, reveal it.
        video.addEventListener("playing", () => {
            document.body.classList.add("video-playing");
            document.removeEventListener("pointerdown", startVideo);
        }, { once: true });

        // On iPhone/iPad, the first tap starts the video.
        document.addEventListener("pointerdown", startVideo);

        // Explore transition.
        exploreButton.addEventListener("click", () => {
            document.body.classList.add("exploring");
        });
    </script>

</body>

</html>
