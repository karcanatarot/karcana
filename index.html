<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karcana</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="assets/full-moon-at-dusk.mp4" type="video/mp4">
    </video>

    <main class="content">
        <h1>Karcana</h1>
    </main>

    <script>
        const video = document.querySelector(".background-video");

        // Explicitly make sure Safari considers the video muted.
        video.muted = true;

        // Try to start playback immediately.
        video.play().catch(() => {
            console.log("Autoplay was blocked.");
        });

        // If Safari requires a user gesture, start playback on the first tap.
        document.addEventListener("touchend", () => {
            video.play().catch(() => {});
        }, { once: true });
    </script>

</body>

</html>
